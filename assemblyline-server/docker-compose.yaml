services:
  minio:
    image: cccs/minio
    environment:
      MINIO_ROOT_USER: al_storage_key
      MINIO_ROOT_PASSWORD: Ch@ngeTh!sPa33w0rd
    ports:
      - "9000:9000"
    command: server /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
    tmpfs:
      - /usr/share/elasticsearch/data
    environment:
      - xpack.security.enabled=true
      - discovery.type=single-node
      - logger.level=WARN
      - "ES_JAVA_OPTS=-Xms2048m -Xmx2048m"
      - ELASTIC_PASSWORD=devpass
    ports:
      - "9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --silent --fail -u elastic:$$ELASTIC_PASSWORD localhost:9200/_cluster/health || exit 1",
        ]
      interval: 30s
      timeout: 30s
      retries: 3
  redis:
    image: redis
    ports:
      - "6379:6379"
    command: redis-server --databases 100000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3

  cargo_test:
    build:
      context: ..
      dockerfile: ./assemblyline-server/test.Dockerfile
      target: setup
    volumes:
      - ../:/usr/src/
      - ./test-config.yaml:/etc/assemblyline/config.yml
    working_dir: /usr/src/assemblyline-server
    command: "cargo test --target-dir /out"
    network_mode: "host"
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
