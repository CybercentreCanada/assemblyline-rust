[package]
name = "assemblyline-client"
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/cybercentreCanada/assemblyline-rust"
homepage = "https://www.cyber.gc.ca/en/tools-services/assemblyline"
description = """A client for the Assemblyline malware analysis platform."""

[dependencies]
reqwest = { version = "0.13", features = ["json", "cookies", "multipart", "stream", "gzip", "brotli", "deflate", "query", "rustls", "native-tls"] }


serde = { version = "1.0", features = ["derive", "std"] }
serde_with = "3.3"
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-recursion = { version = "1" }

url = "2"
chrono = { version = "0.4", features = ["serde"] }

# Assemblyline Utilities
assemblyline-utilities = { version = "0.1.0", path = "../assemblyline-utilities" }
assemblyline-models = { version="0.8", path = "../assemblyline-models" }

# Libraries used for the ingest binary
clap = { version = "4.5", features = ["derive"], optional = true }
configparser = { version = "3", optional = true }
expanduser = { version = "1.2", optional = true }
rand = { version = "0.10", optional = true }
sha2 = { version = "0.11", optional = true }
env_logger = { version = "0.11", optional = true }

[features]
ingest-binary = ["clap"]

[[bin]]
name = "ingest"
required-features = ["ingest-binary"]

[dev-dependencies]
assemblyline-markings = { version="0.2" }
rand = "0.10"
env_logger = "0.11"
