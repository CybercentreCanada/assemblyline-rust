[package]
name = "assemblyline-service-client"
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/cybercentreCanada/assemblyline-rust"
homepage = "https://www.cyber.gc.ca/en/tools-services/assemblyline"
description = """Service client for running each Assemblyline services and communicating with the Assemblyline service API."""

[dependencies]
# Logging
log = "0.4"
flexi_logger = { version = "0.31", features=["syslog_writer"] }

# Utilities
chrono = "0.4"
tempfile = "3.19"
rand = "0.10"
itertools = "0.14"
anyhow = "1.0"
thiserror = "2.0"
bytes = "1.10"
parking_lot = { version = "0.12", features = [] }

environment_template = "0.1"
hex = "0.4"
uuid = "1.10"
urlencoding = "2.1"

# Core framework
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
futures = "0.3"


# Network libraries
reqwest = { version = "0.13", features = ["json", "cookies", "multipart", "stream", "gzip", "brotli", "deflate", "query", "rustls", "native-tls"] }
poem = { version = "3.1", features = ["websocket", "openssl-tls", "anyhow", "multipart"] }
url = "2.5"

# Crypto/hash libraries
digest = "0.10"
openssl = { version = "0.10" }
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.11"

# Data managing
assemblyline-models = { version = "0.8", path = "../assemblyline-models", features = ["rand"] }
struct-metadata = { version = "1.3", features = ["serde_json"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_with = "3.12"

# Assemblyline Utilities
assemblyline-utilities = { version = "0.1.0", path = "../assemblyline-utilities" }

# data parsing
nom = "8"
regex = "1.11"
reqwest-retry = "=0.9.1"

# binding to C library
libc = "0.2"
signal-hook = "0.4.4"

[dev-dependencies]
env_logger = "0"
