
# Don't run this on pull requests, just on a schedule
pr: none
trigger: none
schedules:
- cron: '0 0 * * *'
  displayName: Daily rust build (main)
  branches:
    include:
    - main
  always: true

jobs:
  - job: build_nightly
    dependsOn: []
    displayName: Build Nightly
    steps:
      - checkout: self
      - task: Docker@2
        displayName: Login to docker registry
        inputs:
          command: login
          containerRegistry: cccstemp
      - script: |
          df -h /
          sudo mkdir /usr/local/.trash
          sudo mv /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/.trash/ 2>/dev/null || true
          sudo nohup rm -rf /usr/local/.trash >/dev/null 2>&1 &
        displayName: Free agent disk space
      - script: |
          set -e
          docker build . -f test.Dockerfile --build-arg release='--release' -t cccstemp.azurecr.io/assemblyline-rust-builder:stable
          docker push cccstemp.azurecr.io/assemblyline-rust-builder:stable
        displayName: Build and push container
