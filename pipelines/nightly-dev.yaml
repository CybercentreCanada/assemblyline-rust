
# Don't run this on pull requests, just on a schedule
pr: none
trigger: none
schedules:
- cron: '0 0 * * *'
  displayName: Daily rust build (dev)
  branches:
    include:
    - dev
  always: true

resources:
  repositories:
    - repository: PipelineTemplates
      type: github
      name: CybercentreCanada/assemblyline
      ref: refs/heads/master
      endpoint: github-repo-sa
      trigger: none

jobs:
  - job: build_nightly
    dependsOn: []
    displayName: Build Nightly
    steps:
      - checkout: self
      - task: Docker@2
        displayName: Login to docker registry
        inputs:
          command: login
          containerRegistry: cccstemp
      - template: pipelines/templates/steps/init-agent.yaml@PipelineTemplates
      - script: |
          set -e
          docker build . -f test.Dockerfile --no-cache -t cccstemp.azurecr.io/assemblyline-rust-builder:latest
          docker push cccstemp.azurecr.io/assemblyline-rust-builder:latest
        displayName: Build and push container
