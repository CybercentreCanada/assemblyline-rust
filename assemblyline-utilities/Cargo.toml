[package]
name = "assemblyline-utilities"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cybercentreCanada/assemblyline-rust"
homepage = "https://www.cyber.gc.ca/en/tools-services/assemblyline"
description = """Utility library for functionalities shared between different assemblyline applications."""


[dependencies]

# Data managing
assemblyline-models = { version = "0.8", path = "../assemblyline-models", features = ["rand"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_with = "3.12"

struct-metadata = { version = "1.3", features = ["serde_json"] }


# Logging
log = "0.4"
flexi_logger = { version = "0.31", features=["syslog_writer"] }
gethostname = "1.0"
local-ip-address = "0.6"

# Error handling
anyhow = "1.0"

# Network libraries
reqwest = { version = "0.13", features = ["json", "cookies", "multipart", "stream", "gzip", "brotli", "deflate", "query", "rustls", "native-tls"] }
poem = { version = "3.1", features = ["websocket", "openssl-tls", "anyhow", "multipart"] }
url = "2.5"
rustls = { version = "0.21.7", features = ["dangerous_configuration"] }
rustls-pemfile = "1.0"

# Core framework
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
futures = "0.3"

# Crypto/hash libraries
openssl = { version = "0.10" }
base64 = "0.22"

async-recursion = { version = "1" }
parking_lot = { version = "0.12", features = [] }
itertools = "0.14"


[dev-dependencies]
env_logger = "0"
